# TEMPORARY (ITL-892): measures the interpreter-exit hang on Linux. Not a required
# check; runs only on the investigation branch. Delete before the PR leaves draft.
name: ITL-892 exit-hang probe

on:
  push:
    branches: [eywalker/itl-892-process-hangs-at-interpreter-exit-after]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      J: "4"
      T: "8"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Allow gdb to attach to hung children
        run: |
          sudo apt-get update && sudo apt-get install -y gdb
          sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Install dependencies (locked)
        run: uv sync --locked --dev --python ${{ matrix.python-version }}

      - name: Probe
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: |
          D=superpowers/specs/itl-892-exit-hang
          rm -f $D/results.jsonl
          H() { uv run python $D/harness.py -n 100 -t "$T" -j "$J" "$@"; }
          py=${{ matrix.python-version }}
          H --label "linux op=dataset_scan py$py locked" -- python $D/repro_pure.py --op dataset_scan
          H --label "linux op=to_table py$py locked" -- python $D/repro_pure.py --op to_table
          H --label "linux op=itl864 py$py locked" -- python $D/repro_pure.py --op itl864
          H --label "linux dataset_scan native_fs py$py locked" -- python $D/repro_pure.py --op dataset_scan --read-via native_fs
          H --label "linux dataset_scan no_threads py$py locked" -- python $D/repro_pure.py --op dataset_scan --read-via no_threads
          H --label "linux dataset_scan io_threads=1 py$py locked" -- python $D/repro_pure.py --op dataset_scan --io-threads 1
          H --label "linux dataset_scan mitigation=del py$py locked" -- python $D/repro_pure.py --op dataset_scan --mitigation del
          for m in plain-read source-read pipeline-sync pipeline-async; do
            H --label "linux orcapod $m py$py locked" -- python $D/repro_orcapod.py "$m"
          done
          for v in "22.0.0 1.0.2" "26.0.1 1.6.6"; do
            set -- $v
            uv run --no-project --with "pyarrow==$1" --with "deltalake==$2" python $D/harness.py \
              -n 100 -t "$T" -j "$J" --label "linux op=dataset_scan py$py pa$1 dl$2" -- \
              python $D/repro_pure.py --op dataset_scan
          done
          cat $D/results.jsonl >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results and stacks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: itl-892-linux-py${{ matrix.python-version }}
          path: |
            superpowers/specs/itl-892-exit-hang/results.jsonl
            superpowers/specs/itl-892-exit-hang/samples/
