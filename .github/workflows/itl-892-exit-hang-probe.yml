# TEMPORARY (ITL-892): measures the interpreter-exit hang on Linux. Not a required
# check; runs only on the investigation branch. Delete before the PR leaves draft.
name: ITL-892 exit-hang probe

# Data collected (runs 42969989607, 42972298798); manual trigger only from now on.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      J: "4"
      T: "8"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Allow gdb to attach to hung children
        run: |
          sudo apt-get update && sudo apt-get install -y gdb
          sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Install dependencies (locked)
        run: uv sync --locked --dev --python ${{ matrix.python-version }}

      - name: Probe (round 2 - mitigations through Orcapod, regression check)
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: |
          D=superpowers/specs/itl-892-exit-hang
          rm -rf $D/results.jsonl $D/samples
          H() { uv run python $D/harness.py -n 100 -t "$T" -j "$J" "$@"; }
          py=${{ matrix.python-version }}
          for m in atexit_sleep atexit_sleep_long; do
            H --label "linux dataset_scan mitigation=$m py$py locked" -- python $D/repro_pure.py --op dataset_scan --mitigation "$m"
          done
          for p in none native-fs atexit-sleep atexit-gc; do
            for m in plain-read source-read pipeline-sync; do
              H --label "linux orcapod $m patch=$p py$py locked" -- python $D/repro_orcapod.py "$m" --patch "$p"
            done
          done
          cat $D/results.jsonl >> "$GITHUB_STEP_SUMMARY"
          # Prototype regression check: expected to FAIL unpatched and PASS with native-fs.
          set +e
          start=$(date +%s); uv run pytest $D/regression_check_proto.py -q -p no:cacheprovider 2>&1 | tail -4
          echo "unpatched regression check: rc=${PIPESTATUS[0]} secs=$(( $(date +%s) - start ))"
          start=$(date +%s); ITL892_PATCH=native-fs uv run pytest $D/regression_check_proto.py -q -p no:cacheprovider 2>&1 | tail -4
          echo "native-fs regression check: rc=${PIPESTATUS[0]} secs=$(( $(date +%s) - start ))"
          exit 0

      - name: Upload results and stacks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: itl-892-linux-py${{ matrix.python-version }}
          path: |
            superpowers/specs/itl-892-exit-hang/results.jsonl
            superpowers/specs/itl-892-exit-hang/samples/
