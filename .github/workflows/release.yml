name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0 or v0.1.0 — leading v is stripped automatically)'
        required: true
        type: string
      branch:
        description: 'Branch to cut the release from (defaults to main)'
        required: false
        type: string
        default: main
      skip_tests:
        description: >-
          Skip the test jobs (an exception: only when this exact commit has green required CI
          on metamorphic-labs; see RELEASING.md). Validation, license check and build still run.
        required: false
        type: boolean
        default: false

# Read-only token, whatever the repository default is (ITL-1193); the build
# and publish jobs grant themselves what they need.
permissions:
  contents: read

jobs:
  validate-branch:
    name: Validate release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check branch exists on origin
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          ENCODED_BRANCH="${BRANCH//\//%2F}"
          if ! gh api "repos/${{ github.repository }}/branches/${ENCODED_BRANCH}" --silent 2>/dev/null; then
            echo "::error::Branch '${BRANCH}' does not exist. Check for typos."
            exit 1
          fi
          echo "Branch '${BRANCH}' confirmed."

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [validate-branch]
    # No status function here, so GitHub prepends success(): the tests run only after a
    # successful validation, and not at all when skip_tests is set (ITL-1188).
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every version runs to its own result: one version's failure never cancels the
      # others (ITL-1429). The build still needs every version to pass.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # required: hatch-vcs needs full tag history
          ref: ${{ inputs.branch }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --python ${{ matrix.python-version }}

      - name: Run tests
        # PYTHONFAULTHANDLER prints every thread's traceback if a process dies on a fatal
        # signal, so a crash never ends the log silently (ITL-1229). Failures are listed in
        # the closing summary by pytest's default -rfE.
        env:
          PYTHONFAULTHANDLER: "1"
        run: uv run --python ${{ matrix.python-version }} pytest -n logical -m "not postgres" --tb=short -q

  license-check:
    needs: [validate-branch]
    uses: ./.github/workflows/_license-check.yml
    with:
      branch: ${{ inputs.branch }}

  build:
    name: Build distribution
    needs: [validate-branch, test, license-check]
    # A job whose need was skipped is itself skipped unless its `if` names a status
    # function, and that holds for every later job too, so each job below states its
    # condition itself (ITL-1188). The build runs only when validation and the license check
    # succeeded and the tests succeeded, or were skipped because skip_tests was set. A
    # failed or cancelled test job stops the release in both modes; !cancelled() keeps a
    # cancelled run from starting it.
    if: >-
      ${{
        !cancelled()
        && needs.validate-branch.result == 'success'
        && needs.license-check.result == 'success'
        && (
          needs.test.result == 'success'
          || (needs.test.result == 'skipped' && inputs.skip_tests)
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # required to push the release tag
    outputs:
      version: ${{ steps.classify.outputs.version }}
      # 'true' for a pre-release (aN, bN, rcN, .devN), 'false' for a final release:
      # decided by scripts/check_golden_tags.py, the one rule (ITL-1329).
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - name: Report skipped tests
        if: ${{ inputs.skip_tests }}
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "::warning title=Tests skipped::The release tests were skipped (skip_tests: true, chosen by ${ACTOR})."
          {
            echo "### :warning: Tests skipped"
            echo
            echo "The release tests (Python 3.11, 3.12, 3.13) did not run in this release:"
            echo "\`skip_tests\` was set to \`true\` by **${ACTOR}**."
            echo "Validation, the license check and the build ran as usual."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # required: hatch-vcs reads tag to set version
          ref: ${{ inputs.branch }}

      - name: Classify the version
        id: classify
        # The one normalization of the version input (ITL-1329): writes version=<X.Y.Z>
        # (without the leading v) and prerelease=true|false. Fails on anything that is
        # not a release version in its PEP 440 normal form with at most one leading
        # lowercase v (0.4.0rc1 or v0.4.0rc1; not 0.4.0-rc.1, V0.4.0 or vv0.4.0), so that
        # the tag, the package, the GitHub Release and the Linear release name one
        # version. Every later step uses its version output.
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/check_golden_tags.py --classify-version "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check the golden release step
        # A final release: nothing is tagged or published unless the release pull request
        # ran generate_golden_hashes.py --release for this version (ITL-946). A
        # pre-release freezes nothing: HEAD must not record it as a release (ITL-1329).
        run: python3 scripts/check_golden_tags.py --release-version "${{ steps.classify.outputs.version }}"

      - name: Check golden files against release tags
        # Every golden file, revision and pin an earlier release tag of the current data
        # context shipped is unchanged here (ITL-946), for a pre-release too. Tags of no
        # such release (older data contexts, pre-releases) are not checked; it fails only
        # without git, history or tags.
        run: python3 scripts/check_golden_tags.py

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create local release tag
        run: git tag "v${{ steps.classify.outputs.version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Build wheel and sdist
        run: uv build

      - name: Guard against duplicate tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.classify.outputs.version }}" | grep -q .; then
            echo "::error::Tag v${{ steps.classify.outputs.version }} already exists on origin. Aborting."
            exit 1
          fi

      - name: Push release tag
        run: git push origin "v${{ steps.classify.outputs.version }}"

      - name: Upload dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish → TestPyPI
    needs: build
    # Explicit, because a skipped test job would otherwise skip this job too (see build).
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/orcapod
    permissions:
      id-token: write  # required for OIDC Trusted Publishing
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/ dist/*

  publish-pypi:
    name: Publish → PyPI
    needs: [build, publish-testpypi]
    # Explicit, because a skipped test job would otherwise skip this job too (see build).
    if: >-
      ${{
        !cancelled()
        && needs.build.result == 'success'
        && needs.publish-testpypi.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/orcapod
    permissions:
      id-token: write   # required for OIDC Trusted Publishing
      contents: write   # required for creating GitHub Release
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: "v${{ needs.build.outputs.version }}"
          generate_release_notes: true
          files: dist/*
          # A pre-release is marked as one, and its notes (prepended to the generated
          # ones) say that it freezes nothing (ITL-1329).
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          body: >-
            ${{ needs.build.outputs.prerelease == 'true'
            && 'This is a pre-release. It carries the hashes intended for the final release, but freezes nothing: a golden value may still change before the final release (only for a blocking reason), and data stored with this pre-release is not guaranteed to be valid under the final release.'
            || '' }}

  linear-sync:
    name: Sync Linear release
    needs: build
    # Explicit status check, because a skipped test job would otherwise skip this job too.
    # Not for a pre-release (ITL-1329): sync with a version creates or targets a Linear
    # release of exactly that version, which would split the candidate's issues from the
    # final release; the open Linear release stays open for the final version.
    if: >-
      ${{
        github.repository == 'metamorphic-labs/orcapod-python'
        && !cancelled()
        && needs.build.result == 'success'
        && needs.build.outputs.prerelease == 'false'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: Sync Linear release
        uses: linear/linear-release-action@c0cb8354a362c24c6d3e0948f37fd66d07588e3f  # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: "v${{ needs.build.outputs.version }}"

  linear-complete:
    name: Complete Linear release
    needs: [build, publish-pypi, linear-sync]
    # Explicit status check, because a skipped test job would otherwise skip this job too.
    # Not for a pre-release (ITL-1329): the Linear release is completed by the final one.
    if: >-
      ${{
        github.repository == 'metamorphic-labs/orcapod-python'
        && !cancelled()
        && needs.build.result == 'success'
        && needs.build.outputs.prerelease == 'false'
        && needs.publish-pypi.result == 'success'
        && needs.linear-sync.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - name: Complete Linear release
        uses: linear/linear-release-action@c0cb8354a362c24c6d3e0948f37fd66d07588e3f  # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: "v${{ needs.build.outputs.version }}"
