name: Documentation site

# Builds the documentation site (site/, Astro Starlight) from docs/ and the source on every
# pull request and push to main, so a broken page, link, anchor or docstring fails CI
# (ITL-1170), and publishes it to GitHub Pages from main.
#
# Publishing: the deploy job runs on a push to main and on a manual run (Actions >
# Documentation site > Run workflow, branch main), only in metamorphic-labs/orcapod-python,
# never on a pull request. It needs Settings > Pages > Source = GitHub Actions and
# deploys in the github-pages environment, which GitHub creates. Only a run that deploys
# uploads the built site.
#
# The site's address comes from the repository variables DOCS_SITE_URL (origin, e.g.
# https://docs.example.org) and DOCS_SITE_BASE (base path, e.g. /); one that is not
# defined expands to an empty string, and the build then uses the default,
# https://metamorphic-labs.github.io/orcapod-python/ (site_settings in
# scripts/docs_site_content.py). They are the one source of the address: a custom domain
# is set both there (DOCS_SITE_URL=https://<domain>, DOCS_SITE_BASE=/) and in
# Settings > Pages > Custom domain.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  # A newer push to a pull request cancels the older build; on main, a running build
  # or deploy is never cancelled (a newer run waits).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0   # required: hatch-vcs needs full tag history

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv sync --locked --dev --python "3.11"

      - name: Set up Node
        # The version is the engines.node field of site/package.json.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: site/package.json

      - name: Install pnpm
        # The exact version in the packageManager field of site/package.json, installed
        # with npm: the repository's actions policy does not allow pnpm/action-setup.
        working-directory: site
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Check site dependency licenses
        working-directory: site
        run: pnpm licenses list --json --prod | uv run python ../scripts/check_site_licenses.py

      - name: Build the site
        working-directory: site
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
          DOCS_SITE_BASE: ${{ vars.DOCS_SITE_BASE }}
        run: pnpm build

      - name: Upload the site for GitHub Pages
        # The same condition as the deploy job: only a run that deploys uploads.
        if: >-
          github.repository == 'metamorphic-labs/orcapod-python'
          && github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    # Never on a pull request; from main only, in this repository only (a fork skips it).
    if: >-
      github.repository == 'metamorphic-labs/orcapod-python'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # verify the deployment's origin (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Two deploys never race; a running one is never cancelled.
    concurrency:
      group: docs-site-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
