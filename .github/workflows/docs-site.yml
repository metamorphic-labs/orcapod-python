name: Documentation site

# Builds the documentation site (site/, Astro Starlight) from docs/ and the source on every
# pull request and push, so a broken page, link, anchor or docstring fails CI (ITL-1170).
# The public repository publishes it to GitHub Pages, https://nauticalab.github.io/orcapod-python/
# (the base path is set in site/astro.config.mjs): when `main` is pushed there (a release
# point, see RELEASING.md) or by hand (Run workflow). The development repository only builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The one repository that publishes the site.
  PAGES_REPOSITORY: nauticalab/orcapod-python

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0   # required: hatch-vcs needs full tag history

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv sync --locked --dev --python "3.11"

      - name: Install pnpm
        # The version is the packageManager field of site/package.json.
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          package_json_file: site/package.json

      - name: Set up Node
        # The version is the engines.node field of site/package.json.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: site/package.json
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Check site dependency licenses
        working-directory: site
        run: pnpm licenses list --json --prod | uv run python ../scripts/check_site_licenses.py

      - name: Build the site
        working-directory: site
        run: pnpm build

      - name: Decide whether to publish
        id: publish
        run: echo "publish=${{ github.repository == env.PAGES_REPOSITORY && github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"

      - name: Upload the site for GitHub Pages
        if: steps.publish.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
