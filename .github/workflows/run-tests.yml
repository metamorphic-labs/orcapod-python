name: Run Tests

on:
  push:
    branches: [main, dev, extension-type-system]
  pull_request:
  workflow_dispatch: # Allows manual triggering

# Read-only token, whatever the repository default is (ITL-1193).
permissions:
  contents: read

jobs:
  test:
    # Check name `Tests (3.13)`; distinct from the objective and PostgreSQL suites' (ITL-1212).
    name: Tests (${{ matrix.python-version }})
    needs: license-check
    runs-on: ubuntu-latest
    # id-token: write lets the Codecov upload authenticate by GitHub OIDC, with no stored
    # token (ITL-1193). A fork's pull request gets no OIDC token: the action detects the fork
    # and uploads tokenless instead.
    permissions:
      contents: read
      id-token: write
    strategy:
      # A pull request runs one job, on Python 3.13, whose coverage is the one reported; a
      # push (main) runs all three versions (developer, November 16, 2026; ITL-1181). A
      # failure only Python 3.11 or 3.12 shows is first seen on main.
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.13"]' || '["3.11", "3.12", "3.13"]') }}
    env:
      # sys.monitoring (Python 3.12+) measures coverage at a fraction of the default
      # tracer's cost; Python 3.11 has no sys.monitoring and keeps the C tracer.
      COVERAGE_CORE: ${{ matrix.python-version == '3.11' && 'ctrace' || 'sysmon' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0   # required: hatch-vcs needs full tag history

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --python ${{ matrix.python-version }}

      - name: Check golden files against release tags
        # Every golden file and pin a release tag of the current data context shipped must
        # be unchanged in HEAD (ITL-946). Fails when git, the history or the tags are missing.
        run: uv run --python ${{ matrix.python-version }} python scripts/check_golden_tags.py

      - name: Run tests
        # In parallel on every core of the runner (pytest-xdist; ITL-1181); pytest-cov
        # combines the workers' coverage into one report.
        run: uv run --python ${{ matrix.python-version }} pytest -n logical -v -rsxX --durations=20 -m "not postgres" --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports to Codecov
        if: github.repository == 'metamorphic-labs/orcapod-python'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          use_oidc: true
          # A failed upload fails a push run, where it would otherwise go unseen; it never
          # fails a pull request, whose fork uploads are tokenless (ITL-1193).
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  spiral-integration:
    runs-on: ubuntu-latest
    # Only run on push/manual trigger — not on PRs — to avoid consuming SpiralDB
    # resources on every review cycle. Runs only on the development repository: the public
    # repository has no SpiralDB credentials, so the job is skipped there (ITL-1007).
    #
    # Authentication (ITL-1185): a workload private key. pyspiral reads SPIRAL_CLIENT_ID (the
    # workload id) and SPIRAL_PRIVATE_KEY (the workload's private key as a JWK naming its
    # kid), signs a client assertion and requests a token from https://auth.spiraldb.com with
    # the client_credentials grant. The job requests no GitHub OIDC token (no id-token
    # permission): pyspiral's OIDC path posts a token exchange the server rejects. Requires
    # the SPIRAL_CLIENT_ID and SPIRAL_PRIVATE_KEY secrets and the SPIRAL_PROJECT_ID repository
    # variable; fails loudly, naming each missing setting, so missing settings don't silently
    # drop coverage. Setup and key rotation: RELEASING.md, "SpiralDB integration job".
    # The two secrets are given only to the two steps that read them, not to the job, so no
    # third-party action sees them. The key is passed only through the environment, never on a
    # command line. Never add a step that prints the environment (env, printenv, set -x) or
    # the key to this job.
    if: >-
      github.repository == 'metamorphic-labs/orcapod-python'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # Runs beside the test jobs, not after them (developer, November 16, 2026; ITL-1185): it
    # shares no artifact or output with them, and waiting hid for a long time that SpiralDB
    # sign-in was failing.
    permissions:
      contents: read
    env:
      SPIRAL_INTEGRATION_TESTS: "1"
      SPIRAL_PROJECT_ID: ${{ vars.SPIRAL_PROJECT_ID }}
      SPIRAL_SERVER_URL: https://api.spiraldb.dev  # plain http no longer answers (ITL-1008); the repository variable of this name is not read

    steps:
      - name: Check SpiralDB settings
        # Prints only the names of missing settings and of missing JWK members, never a value.
        env:
          SPIRAL_CLIENT_ID: ${{ secrets.SPIRAL_CLIENT_ID }}
          SPIRAL_PRIVATE_KEY: ${{ secrets.SPIRAL_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$SPIRAL_CLIENT_ID" ] || missing="$missing SPIRAL_CLIENT_ID (secret)"
          [ -n "$SPIRAL_PRIVATE_KEY" ] || missing="$missing SPIRAL_PRIVATE_KEY (secret)"
          [ -n "$SPIRAL_PROJECT_ID" ] || missing="$missing SPIRAL_PROJECT_ID (repository variable)"
          if [ -n "$missing" ]; then
            echo "::error::SpiralDB integration tests cannot run; not set:$missing. See RELEASING.md, 'SpiralDB integration job'."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys
          try:
              key = json.loads(os.environ["SPIRAL_PRIVATE_KEY"])
          except ValueError:
              key = None
          if not isinstance(key, dict):
              sys.exit("::error::SPIRAL_PRIVATE_KEY is not a JSON Web Key (a PEM key is not accepted). See RELEASING.md, 'SpiralDB integration job'.")
          absent = [m for m in ("kty", "kid", "d") if not key.get(m)]
          if absent:
              sys.exit("::error::SPIRAL_PRIVATE_KEY lacks the JWK member(s) " + ", ".join(absent) + " (a private key JWK naming its registered kid is required). See RELEASING.md, 'SpiralDB integration job'.")
          PY

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0   # required: hatch-vcs needs full tag history

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --python "3.11"

      - name: Run SpiralDB integration tests
        env:
          SPIRAL_CLIENT_ID: ${{ secrets.SPIRAL_CLIENT_ID }}
          SPIRAL_PRIVATE_KEY: ${{ secrets.SPIRAL_PRIVATE_KEY }}
        # Serial (-n 0): the integration tests share one SpiralDB project (ITL-1181).
        run: uv run --python "3.11" pytest -n 0 tests/test_databases/test_spiraldb_connector_integration.py -v

  license-check:
    uses: ./.github/workflows/_license-check.yml

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            LGPL-2.0-only, LGPL-2.0-or-later,
            LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later
          # Accepted exceptions, each listed in docs/dev/security-exceptions.md.
          # GHSA-fc5q-39xc-vjpf (picomatch): build-time only (the documentation site's
          # toolchain, site/pnpm-lock.yaml); no patched version as of 2026-11-17.
          # Tracked by ITL-1207: remove when a fix is published.
          allow-ghsas: GHSA-fc5q-39xc-vjpf
