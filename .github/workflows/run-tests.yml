name: Run Tests

on:
  push:
    branches: [main, dev, extension-type-system]
  pull_request:
  workflow_dispatch: # Allows manual triggering

jobs:
  test:
    needs: license-check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0   # required: hatch-vcs needs full tag history

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --python ${{ matrix.python-version }}

      - name: Check golden files against release tags
        # Every golden file and pin a release tag of the current data context shipped must
        # be unchanged in HEAD (ITL-946). Fails when git, the history or the tags are missing.
        run: uv run --python ${{ matrix.python-version }} python scripts/check_golden_tags.py

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v -rsxX --durations=20 -m "not postgres" --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports to Codecov
        if: github.repository == 'metamorphic-labs/orcapod-python'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  spiral-integration:
    runs-on: ubuntu-latest
    # Only run on push/manual trigger — not on PRs — to avoid consuming SpiralDB
    # resources on every review cycle. Runs only on the development repository: the public
    # repository has no SpiralDB credentials, so the job is skipped there (ITL-1007).
    #
    # Authentication (ITL-1185): workload client credentials. pyspiral reads SPIRAL_CLIENT_ID
    # and SPIRAL_CLIENT_SECRET from the environment and requests a token with the
    # client_credentials grant. The SpiralDB server no longer accepts the OIDC token exchange,
    # so the job requests no GitHub OIDC token (no id-token permission). Requires the
    # SPIRAL_CLIENT_ID and SPIRAL_CLIENT_SECRET secrets and the SPIRAL_PROJECT_ID repository
    # variable; fails loudly, naming each missing setting, so missing settings don't silently
    # drop coverage. Setup and secret rotation: RELEASING.md, "SpiralDB integration job".
    # The two secrets are given only to the two steps that read them, not to the job, so
    # no third-party action sees them. Never add a step that prints the environment (env,
    # printenv, set -x) to this job.
    if: >-
      github.repository == 'metamorphic-labs/orcapod-python'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    permissions:
      contents: read
    env:
      SPIRAL_INTEGRATION_TESTS: "1"
      SPIRAL_PROJECT_ID: ${{ vars.SPIRAL_PROJECT_ID }}
      SPIRAL_SERVER_URL: https://api.spiraldb.dev  # plain http no longer answers (ITL-1008); the repository variable of this name is not read

    steps:
      - name: Check SpiralDB settings
        # Tests only whether each setting is empty and prints only the names of the
        # missing ones, never a value.
        env:
          SPIRAL_CLIENT_ID: ${{ secrets.SPIRAL_CLIENT_ID }}
          SPIRAL_CLIENT_SECRET: ${{ secrets.SPIRAL_CLIENT_SECRET }}
        run: |
          missing=""
          [ -n "$SPIRAL_CLIENT_ID" ] || missing="$missing SPIRAL_CLIENT_ID (secret)"
          [ -n "$SPIRAL_CLIENT_SECRET" ] || missing="$missing SPIRAL_CLIENT_SECRET (secret)"
          [ -n "$SPIRAL_PROJECT_ID" ] || missing="$missing SPIRAL_PROJECT_ID (repository variable)"
          if [ -n "$missing" ]; then
            echo "::error::SpiralDB integration tests cannot run; not set:$missing. See RELEASING.md, 'SpiralDB integration job'."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0   # required: hatch-vcs needs full tag history

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --python "3.11"

      - name: Run SpiralDB integration tests
        env:
          SPIRAL_CLIENT_ID: ${{ secrets.SPIRAL_CLIENT_ID }}
          SPIRAL_CLIENT_SECRET: ${{ secrets.SPIRAL_CLIENT_SECRET }}
        run: uv run --python "3.11" pytest tests/test_databases/test_spiraldb_connector_integration.py -v

  license-check:
    uses: ./.github/workflows/_license-check.yml

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          deny-licenses: >-
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            LGPL-2.0-only, LGPL-2.0-or-later,
            LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later
