[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v
pythonpath = src
markers =
    postgres: mark test as requiring a live PostgreSQL instance
    integration: mark test as an integration test (may be slower)
    s3: tests that need an S3 endpoint (a moto server started by the s3_server fixture, or MINIO_ENDPOINT)
# The library value types warn that their hashes are provisional (ITL-1068), once per
# type per process, so whichever test uses one first would show it. The tests of the
# warning record it explicitly. The pipeline diagram is in development (ITL-1197) and
# warns once per process in the same way.
filterwarnings =
    ignore::orcapod.errors.ProvisionalHashWarning
    ignore::orcapod.errors.InDevelopmentWarning
